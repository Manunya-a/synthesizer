<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Синтезатор</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="panel transport" id="transport">
    <button class="btn-play" id="btn-play" type="button" aria-pressed="false">
      <svg class="btn-play__icon" id="btn-play-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="5,3 21,12 5,21" /></svg>
      <span id="btn-play-label">Открыть врата</span>
    </button>

    <label class="transport__group transport__group--tempo">
      <span class="transport__name">BPM</span>
      <input class="slider slider--light" type="range" min="60" max="180" step="1" data-param="tempo" aria-label="Темп (BPM)">
      <output class="transport__value" id="tempo-value">84</output>
    </label>

    <label class="transport__group transport__group--master">
      <svg class="transport__speaker" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input class="slider slider--light" type="range" min="0" max="1" step="0.01" data-param="master" aria-label="Общая громкость">
    </label>
  </header>

  <div class="row row--sources">

    <section class="panel accent-red" id="synth1" aria-labelledby="synth1-title">
      <header class="panel__header"><span class="panel__dot" aria-hidden="true"></span><h2 class="panel__title" id="synth1-title">SYNTH 1</h2></header>
      <div class="wave-group" role="group" aria-label="Тип волны Synth 1" data-synth="synth1">
        <button type="button" class="wave-btn" data-wave="sine">sine</button>
        <button type="button" class="wave-btn" data-wave="triangle">triangle</button>
        <button type="button" class="wave-btn" data-wave="square">square</button>
        <button type="button" class="wave-btn" data-wave="sawtooth">sawtooth</button>
      </div>
      <div class="channel" id="ch-s1">
        <label class="control"><span class="control__label">VOLUME</span><input class="slider" type="range" min="0" max="1" step="0.01" data-param="ch-s1.volume"></label>
        <label class="control"><span class="control__label">PAN</span><input class="slider" type="range" min="0" max="1" step="0.01" data-param="ch-s1.pan"></label>
      </div>
    </section>

    <section class="panel accent-green" id="synth2" aria-labelledby="synth2-title">
      <header class="panel__header"><span class="panel__dot" aria-hidden="true"></span><h2 class="panel__title" id="synth2-title">SYNTH 2</h2></header>
      <div class="wave-group" role="group" aria-label="Тип волны Synth 2" data-synth="synth2">
        <button type="button" class="wave-btn" data-wave="sine">sine</button>
        <button type="button" class="wave-btn" data-wave="triangle">triangle</button>
        <button type="button" class="wave-btn" data-wave="square">square</button>
        <button type="button" class="wave-btn" data-wave="sawtooth">sawtooth</button>
      </div>
      <div class="channel" id="ch-s2">
        <label class="control"><span class="control__label">VOLUME</span><input class="slider" type="range" min="0" max="1" step="0.01" data-param="ch-s2.volume"></label>
        <label class="control"><span class="control__label">PAN</span><input class="slider" type="range" min="0" max="1" step="0.01" data-param="ch-s2.pan"></label>
      </div>
    </section>

    <section class="panel accent-yellow" id="drums" aria-labelledby="drums-title">
      <header class="panel__header"><span class="panel__dot" aria-hidden="true"></span><h2 class="panel__title" id="drums-title">DRUMS</h2></header>
      <canvas class="visualizer" id="drums-visualizer" aria-hidden="true"></canvas>
      <div class="channel" id="ch-dr">
        <label class="control"><span class="control__label">VOLUME</span><input class="slider" type="range" min="0" max="1" step="0.01" data-param="ch-dr.volume"></label>
        <label class="control"><span class="control__label">PAN</span><input class="slider" type="range" min="0" max="1" step="0.01" data-param="ch-dr.pan"></label>
      </div>
    </section>
  </div>
  <div class="row row--effects">
    <section class="panel panel--fx accent-red" id="fx-distortion">
      <header class="panel__header"><span class="panel__dot" aria-hidden="true"></span><h2 class="panel__title">DISTORTION</h2></header>
      <input class="slider" type="range" min="0" max="1" step="0.01" data-param="fx-distortion" aria-label="Distortion: количество">
    </section>
    <section class="panel panel--fx accent-green" id="fx-delay">
      <header class="panel__header"><span class="panel__dot" aria-hidden="true"></span><h2 class="panel__title">DELAY</h2></header>
      <input class="slider" type="range" min="0" max="1" step="0.01" data-param="fx-delay" aria-label="Delay: количество">
    </section>
    <section class="panel panel--fx accent-yellow" id="fx-reverb">
      <header class="panel__header"><span class="panel__dot" aria-hidden="true"></span><h2 class="panel__title">REVERB</h2></header>
      <input class="slider" type="range" min="0" max="1" step="0.01" data-param="fx-reverb" aria-label="Reverb: количество">
    </section>
    <section class="panel panel--fx accent-dark" id="fx-glitch">
      <header class="panel__header"><span class="panel__dot" aria-hidden="true"></span><h2 class="panel__title">GLITCH</h2></header>
      <input class="slider" type="range" min="0" max="1" step="0.01" data-param="fx-glitch" aria-label="Glitch: количество">
    </section>
  </div>
  <section class="panel panel--seq" id="sequencer" aria-label="Секвенсор">
    <span class="seq__pulse" id="seq-pulse" aria-hidden="true"></span>
    <div class="seq__grid" id="seq-grid"></div>
  </section>

</div>
<script src="script.js"></script>
</body>
</html>
